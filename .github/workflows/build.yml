name: Auto Build Complete APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Unzip & Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle
        unzip -o '*.zip'
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Project Structure and Build
      run: |
        # البحث عن المجلد الذي يحتوي على مجلد app أو ملف build.gradle الخاص بـ app
        APP_DIR=$(find . -type d -name "app" | head -n 1)
        if [ ! -z "$APP_DIR" ]; then
          PROJECT_ROOT=$(dirname "$APP_DIR")
          cd "$PROJECT_ROOT"
        fi

        # التأكد من صحة إعدادات settings.gradle لربط وحدة app
        echo "include ':app'" > settings.gradle

        # كتابة build.gradle صحيح للجذر يدعم مشاريع أندرويد
        printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath \"com.android.tools.build:gradle:7.4.2\"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle

        # توليد الـ Wrapper وتشغيل البناء للـ app مباشرة
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-stealer-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
