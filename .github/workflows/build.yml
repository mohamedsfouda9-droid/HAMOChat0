name: Auto Build Complete APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Unzip & Latest Gradle 8.0
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget
        
        wget https://services.gradle.org/distributions/gradle-8.0-bin.zip
        sudo mkdir -p /opt/gradle
        sudo unzip -d /opt/gradle gradle-8.0-bin.zip
        echo "/opt/gradle/gradle-8.0/bin" >> $GITHUB_PATH

        unzip -o '*.zip' || true
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Complete Build Environment & Build
      run: |
        # 1. تحديد مجلد التطبيق الرئيسي أو إنشائه
        if [ ! -d "app" ]; then
          SUB_DIR=$(find . -type d -name "app" | head -n 1)
          if [ ! -z "$SUB_DIR" ]; then
            cd "$(dirname "$SUB_DIR")"
          else
            mkdir -p app/src/main
          fi
        fi

        # 2. إنشاء app/build.gradle مع ضبط الـ namespace والتوافق
        mkdir -p app
        cat << 'EOF' > app/build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
EOF

        # 3. إنشاء settings.gradle للربط
        echo "include ':app'" > settings.gradle

        # 4. إنشاء build.gradle الرئيسي (Root)
        cat << 'EOF' > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF

        # 5. تشغيل البناء مباشرة
        gradle :app:assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/build/outputs/apk/debug/app-debug.apk'
