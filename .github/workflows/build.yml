name: Build APK with Generated Wrapper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Unzip & Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle
        unzip -o '*.zip'
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Wrapper and Build
      run: |
        # العثور على المجلد الذي يحتوي على ملف build.gradle الرئيسي للمشروع
        BUILD_FILE=$(find . -name "build.gradle" -not -path "*/.*" | head -n 1)
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        
        echo "Project directory is: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # إنشاء هيكل الـ gradle wrapper وربطه بالنسخة القياسية تلقائياً
        gradle wrapper --gradle-version 8.0
        
        # منح الصلاحيات والبناء
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-stealer-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
