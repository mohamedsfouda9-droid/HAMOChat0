name: Auto Build Complete APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Unzip & Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle
        unzip -o '*.zip'
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Structure and Build
      run: |
        if [ ! -d "app" ]; then
          SUB_DIR=$(find . -maxdepth 2 -type d -name "app" | head -n 1)
          if [ ! -z "$SUB_DIR" ]; then
            cd "$(dirname "$SUB_DIR")"
          fi
        fi

        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "Creating missing settings.gradle..."
          echo "include ':app'" > settings.gradle
        fi

        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          echo "Creating root build.gradle..."
          printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath \"com.android.tools.build:gradle:7.4.2\"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle
        fi

        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-stealer-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
