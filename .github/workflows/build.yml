name: Build APK with Auto Path Detection

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Unzip & Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip gradle
        unzip -o '*.zip'
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate Project Root and Build
      run: |
        # البحث عن ملف settings.gradle لتحديد مجلد جذر المشروع بدقة
        SETTINGS_FILE=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          # إذا لم يوجد settings.gradle، نبحث عن settings.gradle.kts
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" -not -path "*/.*" | head -n 1)
        fi
        
        if [ -z "$SETTINGS_FILE" ]; then
          echo "Error: settings.gradle not found anywhere in extracted files!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$SETTINGS_FILE")
        echo "Found project root at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        
        # إنشاء الـ Wrapper وبناء الـ APK داخل المجلد الصحيح
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-stealer-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
